<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valentina Petalosi — Portfolio</title>
<style>
  @font-face { font-family: "Karla"; src: url("../src/assets/fonts/Karla.ttf") format("truetype"); font-weight: 200 800; }
  @font-face { font-family: "Karla"; src: url("../src/assets/fonts/KarlaItalic.ttf") format("truetype"); font-weight: 200 800; font-style: italic; }
  @font-face { font-family: "Roca"; src: url("../src/assets/fonts/RocaOne-Rg.woff2") format("woff2"); font-weight: 400; }

  :root {
    --ivory: #f6f1e7;
    --ink: #1a1814;
    --soft: #6b655a;
    --tone: #e9e2d4;
    --pad: 72px;
    --gap: 32px;
  }
  @page { size: 1920px 1080px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #cfc9bd; }
  body { font-family: "Karla", sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .slide {
    width: 1920px; height: 1080px; background: var(--ivory);
    padding: 40px var(--pad) var(--pad);
    display: grid; grid-template-rows: auto 1fr; row-gap: 36px;
    overflow: hidden; margin: 0 auto 40px; page-break-after: always; break-after: page;
  }
  @media print { html, body { background: var(--ivory); } .slide { margin: 0; } }

  /* Top strip: project type · project name · role & year */
  .strip { display: grid; grid-template-columns: 1fr auto 1fr; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .strip span:nth-child(2) { text-align: center; }
  .strip span:nth-child(3) { text-align: right; }

  .body { min-height: 0; display: grid; gap: var(--gap); }

  figure { position: relative; min-height: 0; overflow: hidden; background: var(--tone); }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figure.contain img { object-fit: contain; }
  figure .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
               font-size: 20px; color: var(--soft); }

  h1, h2 { font-family: "Roca", serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1; }
  h2 { font-size: 56px; }
  .display { font-size: 96px; letter-spacing: -0.02em; }
  p { font-size: 20px; line-height: 1.5; max-width: 60ch; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 20px; font-size: 20px; line-height: 1.4; }
  .meta dt { font-weight: 700; }
  .stack { display: flex; flex-direction: column; gap: 22px; }

  /* Layout: intro — one column of text + image, one large image */
  .intro { grid-template-columns: 1fr 2fr; }
  .intro .left { display: grid; grid-template-rows: 1fr auto; gap: var(--gap); min-height: 0; }

  /* Layout: triptych — three images, a caption under each */
  .triptych { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr auto; row-gap: 24px; }
  .triptych .col { display: grid; grid-row: span 2; grid-template-rows: subgrid; min-height: 0; }

  /* Layout: outcome — large image, side column with results */
  .outcome { grid-template-columns: 2fr 1fr; }
  .outcome .right { display: grid; grid-template-rows: auto 1fr; gap: var(--gap); min-height: 0; }
  .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .figures b { display: block; font-family: "Roca", serif; font-weight: 400; font-size: 56px; line-height: 1.05; }
  .figures span { font-size: 20px; line-height: 1.4; }

  /* Cover */
  .cover .body { grid-template-columns: 1fr 1.25fr; }
  .cover .left { display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }
  .cover img.logo { width: 520px; display: block; }
  .cover .sub { margin-top: 24px; max-width: 34ch; }
  .cover ol { list-style: none; font-size: 20px; line-height: 1.4; display: grid; gap: 10px; margin-top: 48px; max-width: 640px; }
  .cover ol li { display: grid; grid-template-columns: 1fr auto; gap: 24px; }
  .cover ol li span:last-child { color: var(--soft); }

  /* About */
  .about .body { grid-template-columns: 1fr 1fr; }
</style>
</head>
<body>
<main id="deck"></main>

<script>
/*
  All content lives here. Each project gets up to three slides.
  Image paths are relative to this file, e.g. "images/la-paz/01.jpg".
  Leave `src` empty to show a labelled placeholder.
*/
const PROJECTS = [
  {
    name: "Rayuela",
    type: "Public art · Participatory design",
    role: "Designer & project lead · 2024",
    slides: [
      {
        layout: "intro",
        title: "Rayuela",
        meta: [
          ["Where", "La Paz, Bogotá, Colombia"],
          ["Funding", "Museo Abierto de Bogotá grant, IDARTES · COP 38M"],
          ["Role", "Concept, design, budget and project lead"],
          ["Team", "3 artists I hired by open call, 3-person film crew"],
          ["Timeline", "Jan–Feb 2024 · 10 days on site"],
        ],
        text: "Women and girls don't use public space the way men and boys do, and they stop playing much younger. Rayuela turned half of the football court in La Paz, a stigmatised barrio born as an informal settlement, into 300 m² of play designed to bring them back.",
        images: [
          { src: "", label: "Court before the intervention" },
          { src: "", label: "Finished court, drone view" },
        ],
      },
      {
        layout: "triptych",
        columns: [
          { src: "", label: "Play workshop with children", text: "Listen. A play workshop with the neighbourhood's children mapped the games they already chalk on the ground." },
          { src: "", label: "Painting workshop / design proposals", text: "Co-design. A painting workshop showed the colours and shapes they wanted. I drew two proposals and the community voted." },
          { src: "", label: "Painting the court", text: "Build. Ten days of painting, planned around the daily rain, with water and power rented from neighbours' homes." },
        ],
      },
      {
        layout: "outcome",
        image: { src: "", label: "Girls playing on the finished court" },
        heading: "Outcome",
        figures: [
          ["300 m²", "of court painted with the community's design"],
          ["COP 38M", "public grant budgeted and executed"],
          ["2 → 1", "design proposals, chosen by community vote"],
          ["7", "people coordinated, plus a second team on the other half"],
        ],
        text: "Managing it meant postponed dates, a surface the paint supplier called unfit, and a shared court with another team. I learned to lock dates before committing money, and to earn neighbours' trust before the first coat.",
        side: { src: "", label: "Detail of the painted games" },
      },
    ],
  },
  { name: "Deriva Collection", type: "Brand management · Product design", role: "Founder & creative director · [year]", slides: [] },
  { name: "Ana María Cosméticos", type: "[Project type]", role: "[Role · year]", slides: [] },
  { name: "Jacarandas", type: "[Project type]", role: "[Role · year]", slides: [] },
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fig = (im, extra = "") =>
  `<figure class="${im.fit === "contain" ? "contain" : ""} ${extra}">` +
  (im.src ? `<img src="${esc(im.src)}" alt="${esc(im.label || "")}">` : `<div class="ph">${esc(im.label || "Image")}</div>`) +
  `</figure>`;
const strip = (a, b, c) => `<header class="strip"><span>${esc(a)}</span><span>${esc(b)}</span><span>${esc(c)}</span></header>`;

const layouts = {
  intro: (s) => `
    <div class="body intro">
      <div class="left">
        ${fig(s.images[0])}
        <div class="stack">
          <h1 class="display">${esc(s.title)}</h1>
          <dl class="meta">${s.meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
          <p>${esc(s.text)}</p>
        </div>
      </div>
      ${fig(s.images[1])}
    </div>`,
  triptych: (s) => `
    <div class="body triptych">
      ${s.columns.map((c) => `<div class="col">${fig(c)}<p>${esc(c.text)}</p></div>`).join("")}
    </div>`,
  outcome: (s) => `
    <div class="body outcome">
      ${fig(s.image)}
      <div class="right">
        <div class="stack">
          <h2>${esc(s.heading)}</h2>
          <div class="figures">${s.figures.map(([n, l]) => `<div><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>
          <p>${esc(s.text)}</p>
        </div>
        ${fig(s.side)}
      </div>
    </div>`,
};

const cover = `
  <section class="slide cover">
    ${strip("Portfolio", "Valentina Petalosi", "Parsons School of Design · 2027 intake")}
    <div class="body">
      <div class="left">
        <img class="logo" src="../src/assets/logo-valentina-ink.webp" alt="Valentina Petalosi">
        <div>
          <h1 class="display">Selected work</h1>
          <p class="sub">Application to the MS in Strategic Design and Management, Parsons School of Design.</p>
          <ol>${PROJECTS.map((p) => `<li><span>${esc(p.name)}</span><span>${esc(p.type.split(" · ")[0])}</span></li>`).join("")}</ol>
        </div>
      </div>
      ${fig({ src: "", label: "Cover photo: Rayuela, drone view of the finished court" })}
    </div>
  </section>`;

const about = `
  <section class="slide about">
    ${strip("About", "Valentina Petalosi", "[City, country]")}
    <div class="body">
      ${fig({ src: "", label: "Portrait or working photo" })}
      <div class="stack" style="align-self:end">
        <h2>About me</h2>
        <p>[Short introduction: background, what you do today, and why strategic design and management is the next step. Four to five sentences.]</p>
      </div>
    </div>
  </section>`;

document.getElementById("deck").innerHTML =
  cover + about +
  PROJECTS.flatMap((p) =>
    p.slides.map((s) => `<section class="slide">${strip(p.type, p.name, p.role)}${layouts[s.layout](s)}</section>`)
  ).join("");
</script>
</body>
</html>
