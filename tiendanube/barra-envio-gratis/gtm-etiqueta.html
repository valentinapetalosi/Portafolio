<!-- Petalosi · Barra de envío gratis. Google Tag Manager: Etiqueta "HTML personalizado", activador "All Pages".
     Reemplaza por completo el código anterior de la barra.
     - Lee el subtotal real del carrito (data-priceraw / LS.cart), que sí se actualiza al agregar productos.
     - Con el carrito abierto, la barra flotante se oculta y aparece dentro del carrito, justo encima de
       "Iniciar compra", así nunca tapa el botón.
     - La barra flotante no captura toques (pointer-events:none). -->
<script>
(function (run) {
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', run) : run();
})(function () {
  if (window.__petalosiFreeship) return;
  window.__petalosiFreeship = true;

  var META = 300000; // envío gratis desde $300.000

  function subtotal() {
    // 1) El span del subtotal guarda el valor en centavos en data-priceraw y se actualiza con cada cambio.
    var el = document.querySelector('.js-cart-subtotal[data-priceraw]');
    if (el) {
      var raw = parseInt(el.getAttribute('data-priceraw'), 10);
      if (!isNaN(raw)) return Math.round(raw / 100);
    }
    // 2) Objeto del carrito de Tiendanube (también en centavos).
    if (window.LS && LS.cart && typeof LS.cart.subtotal === 'number') return Math.round(LS.cart.subtotal / 100);
    // 3) Último recurso: el texto visible ("$75.000").
    el = document.querySelector('.js-cart-subtotal') || document.querySelector('.js-cart-widget-total');
    var digits = el ? (el.textContent || '').replace(/[^\d]/g, '') : '';
    return digits ? parseInt(digits, 10) : 0;
  }

  function mensaje(total) {
    if (total >= META) return '¡Envío gratis desbloqueado! 🌸';
    if (total <= 0) return 'Agrega $' + META.toLocaleString('es-CO') + ' y obtén envío gratis';
    return 'Te faltan $' + (META - total).toLocaleString('es-CO') + ' para el envío gratis';
  }

  function crearBarra(id, flotante) {
    var d = document.createElement('div');
    d.id = id;
    d.setAttribute('role', 'status');
    d.style.cssText = (flotante
      ? 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99998;max-width:320px;width:calc(100% - 32px);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);'
      : 'position:static;width:100%;margin:0 0 12px;') +
      'background:#16140F;color:#F5E9D3;font-family:inherit;padding:10px 18px;border-radius:16px;box-sizing:border-box;';
    d.innerHTML =
      '<div data-freeship-text style="font-size:12.5px;margin-bottom:6px;text-align:center;line-height:1.3;"></div>' +
      '<div style="background:rgba(245,233,211,.25);border-radius:999px;height:7px;overflow:hidden;">' +
      '<div data-freeship-fill style="height:100%;width:0%;background:linear-gradient(90deg,#F2984C,#E87DA0);border-radius:999px;transition:width .4s ease;"></div></div>';
    return d;
  }

  var flotante = crearBarra('petalosi-freeship-bar', true);
  var enCarrito = crearBarra('petalosi-freeship-cart', false);
  document.body.appendChild(flotante);

  function pintar(barra, total) {
    var t = barra.querySelector('[data-freeship-text]');
    var f = barra.querySelector('[data-freeship-fill]');
    var txt = mensaje(total);
    if (t.textContent !== txt) t.textContent = txt;
    f.style.width = Math.max(0, Math.min(100, total / META * 100)) + '%';
  }

  function carritoAbierto() {
    var m = document.getElementById('modal-cart');
    return !!(m && m.classList.contains('modal-show') && m.getBoundingClientRect().width > 0);
  }

  function actualizar() {
    var total = subtotal();
    var abierto = carritoAbierto();
    var boton = document.getElementById('ajax-cart-submit-div');

    // Dentro del carrito: barra normal (no flotante) justo encima de "Iniciar compra".
    if (abierto && boton && boton.parentNode) {
      if (enCarrito.nextSibling !== boton) boton.parentNode.insertBefore(enCarrito, boton);
      pintar(enCarrito, total);
    } else if (enCarrito.parentNode) {
      enCarrito.parentNode.removeChild(enCarrito);
    }

    // La flotante se esconde con cualquier ventana abierta (carrito, aviso de producto agregado, etc.).
    var hayModal = abierto || document.body.classList.contains('modal-show');
    flotante.style.display = hayModal ? 'none' : '';
    if (!hayModal) pintar(flotante, total);
  }

  actualizar();
  new MutationObserver(function () { clearTimeout(actualizar._t); actualizar._t = setTimeout(actualizar, 50); })
    .observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'data-priceraw'] });
  setInterval(actualizar, 1500);
});
</script>
