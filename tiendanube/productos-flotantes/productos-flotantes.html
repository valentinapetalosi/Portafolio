<!--
  Petalosi · Productos destacados flotando sobre el banner principal
  -----------------------------------------------------------------
  Pega TODO este bloque (estilos + script) en Tiendanube:
  Configuración › Códigos externos (sección de scripts / "código en el footer").

  Productos: los más vendidos de los últimos 15 días (13–28 sep 2026).
  Para cambiarlos, edita PRODUCT_IDS más abajo.
  El script lee nombre, foto, precio y descuento de los productos que ya
  se muestran en el home, así que precios y promos se actualizan solos.
  Si un producto no aparece en el home, usa los datos de FALLBACK.
-->
<style>
  .pf-floating {
    --pf-card-bg: #ffe3f3;
    --pf-title: #ff5a1f;
    --pf-text: #7a4f9a;
    --pf-price: #5b5fb5;
    --pf-old: #a9a2c9;
    position: relative;
    z-index: 5;
    margin-top: -24px;           /* cuánto se montan las tarjetas sobre el banner */
    margin-bottom: 32px;
    padding: 0 24px;
    pointer-events: none;        /* deja clicar el banner entre tarjetas */
  }
  /* Título "Los favoritos de la semana" en una nubecita */
  .pf-floating__head {
    position: absolute;          /* la nube va encima del banner, sin empujar las tarjetas */
    bottom: 100%;
    left: 24px;
    margin-bottom: 14px;
    text-align: left;            /* a la izquierda: no tapa el botón del banner */
  }
  .pf-cloud {
    position: relative;
    display: inline-block;
    margin-top: 36px;            /* espacio para las "bolitas" de la nube */
    padding: 12px 40px 14px;
    background: var(--pf-card-bg);
    border-radius: 999px;
    filter: drop-shadow(0 10px 18px rgba(60, 20, 60, .2));
    animation: pf-float 6s ease-in-out infinite;
    animation-delay: -1s;
  }
  .pf-cloud::before,
  .pf-cloud::after {
    content: "";
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    background: var(--pf-card-bg);
  }
  .pf-cloud::before { width: 58px; height: 58px; top: -28px; left: 20%; }
  .pf-cloud::after  { width: 78px; height: 78px; top: -40px; right: 18%; }
  .pf-cloud__text {
    position: relative;
    margin: 0;
    font-family: var(--heading-font, "Literata", serif);
    font-size: 26px;
    line-height: 1.2;
    color: var(--pf-title);
  }
  .pf-floating__track {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .pf-card {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: var(--pf-card-bg);
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(60, 20, 60, .18);
    color: inherit;
    text-decoration: none !important;
    transition: transform .25s ease, box-shadow .25s ease;
    animation: pf-float 6s ease-in-out infinite;
  }
  .pf-card:nth-child(2) { animation-delay: -2s; }
  .pf-card:nth-child(3) { animation-delay: -4s; }
  .pf-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(60, 20, 60, .26);
    animation-play-state: paused;
  }
  @keyframes pf-float {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -6px; }
  }
  .pf-card__img {
    flex: 0 0 120px;
    width: 120px;
    height: 120px;
    border-radius: 18px;
    object-fit: cover;
    background: #fff;
  }
  .pf-card__body { min-width: 0; }
  .pf-card__name {
    margin: 0 0 6px;
    font-family: var(--heading-font, "Literata", serif);
    font-size: 20px;
    line-height: 1.2;
    color: var(--pf-title);
  }
  .pf-card__desc {
    margin: 0 0 10px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--pf-text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pf-card__price {
    font-weight: 700;
    font-size: 17px;
    color: var(--pf-price);
  }
  .pf-card__old {
    margin-left: 8px;
    font-weight: 400;
    font-size: 14px;
    color: var(--pf-old);
    text-decoration: line-through;
  }

  /* Tablet: tarjetas más compactas */
  @media (max-width: 1100px) {
    .pf-card { gap: 14px; padding: 14px; }
    .pf-card__img { flex-basis: 88px; width: 88px; height: 88px; }
    .pf-card__name { font-size: 17px; }
    .pf-card__desc { display: none; }
  }
  /* Celular: carrusel horizontal deslizable */
  @media (max-width: 767px) {
    .pf-floating { margin-top: 0; padding: 0; }
    .pf-floating__head { position: static; margin-bottom: 4px; padding: 0 16px; }
    .pf-cloud { margin-top: 30px; padding: 10px 30px 12px; }
    .pf-cloud::before { width: 46px; height: 46px; top: -22px; }
    .pf-cloud::after  { width: 62px; height: 62px; top: -32px; }
    .pf-cloud__text { font-size: 21px; }
    .pf-floating__track {
      display: flex;
      gap: 12px;
      padding: 8px 16px 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .pf-floating__track::-webkit-scrollbar { display: none; }
    .pf-card { flex: 0 0 82%; scroll-snap-align: center; }
  }
  /* En computador se esconden los puntitos del carrusel (quedarían debajo de
     las tarjetas); las flechas siguen funcionando. */
  @media (min-width: 768px) {
    .pf-on [data-store="home-slider"] .swiper-pagination { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pf-card, .pf-cloud { animation: none; }
  }
</style>

<script>
(function () {
  // ▼▼ Título de la sección ▼▼
  var TITLE = 'Los favoritos de la semana';

  // ▼▼ Productos a destacar (IDs de Tiendanube, en el orden en que se muestran) ▼▼
  // Más vendidos del 13 al 28 de sept. 2026. Todos empataron en 1 unidad,
  // así que se eligieron los de las compras más recientes.
  var PRODUCT_IDS = ['348267174', '284226623', '342868992'];

  // Datos de respaldo por si el producto no está en ninguna lista del home.
  // "desc" se usa siempre como texto corto de la tarjeta.
  var FALLBACK = {
    '348267174': {
      name: 'Portapinceles Ajolote',
      url: 'https://www.petalosi.co/productos/portapinceles-tigre-copia-sd8b1/',
      image: 'https://acdn-us.mitiendanube.com/stores/005/464/701/products/portapinceles-morado-5cdd168ada5a130cf117805043514422-480-0.webp',
      desc: 'Organiza tus pinceles con estilo: trae una tira resistente para amarrarlo.',
      price: '$65.000', old: ''
    },
    '284226623': {
      name: 'Sombrero Trampolín',
      url: 'https://www.petalosi.co/productos/sombrero-trampolin/',
      image: 'https://acdn-us.mitiendanube.com/stores/005/464/701/products/img_0663-783031a662c4d9af3917537153928826-480-0.webp',
      desc: 'Doble estampado, ligero y cómodo. Ideal para el sol colombiano.',
      price: '$60.000', old: '$85.000'
    },
    '342868992': {
      name: 'Bolso impermeable Cigüeña japonesa',
      url: 'https://www.petalosi.co/productos/bolso-impermeable-flores-electricas-1xp3t/',
      image: 'https://acdn-us.mitiendanube.com/stores/005/464/701/products/5-9ee68ecdbbb986d32e17782588752066-480-0.webp',
      desc: 'Resistente y portátil, para la playa, el mercado o la oficina.',
      price: '$80.000', old: ''
    }
  };

  function readFromPage(id) {
    var item = document.querySelector('.js-item-product[data-product-id="' + id + '"]');
    if (!item) return null;
    var data = {};
    try {
      var ld = item.querySelector('script[type="application/ld+json"]');
      var info = JSON.parse(ld.textContent);
      data.name = info.name;
      data.url = info.offers && info.offers.url;
      data.image = info.image;
      data.desc = info.description;
    } catch (e) { return null; }
    try {
      var variants = JSON.parse(item.getAttribute('data-variants') || '[]');
      var available = variants.filter(function (v) { return v.available; });
      var list = available.length ? available : variants;
      list.sort(function (a, b) { return a.price_number - b.price_number; });
      var cheapest = list[0];
      if (cheapest) {
        var varies = list.some(function (v) { return v.price_number !== cheapest.price_number; });
        data.price = (varies ? 'Desde ' : '') + cheapest.price_short;
        data.old = cheapest.compare_at_price_short || '';
      }
    } catch (e) {}
    return data.name && data.url ? data : null;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function buildCard(p) {
    var a = el('a', 'pf-card');
    a.href = p.url;
    var img = el('img', 'pf-card__img');
    img.src = p.image;
    img.alt = p.name;
    img.loading = 'lazy';
    var body = el('div', 'pf-card__body');
    body.appendChild(el('h3', 'pf-card__name', p.name));
    if (p.desc) body.appendChild(el('p', 'pf-card__desc', p.desc));
    if (p.price) {
      var price = el('div', 'pf-card__price', p.price);
      if (p.old) price.appendChild(el('span', 'pf-card__old', p.old));
      body.appendChild(price);
    }
    a.appendChild(img);
    a.appendChild(body);
    return a;
  }

  function init() {
    if (document.querySelector('.pf-floating')) return;
    // Se inserta justo después del carrusel (antes de apps como las reseñas).
    var hero = document.querySelector('.section-slideshow [data-store="home-slider"]') ||
               document.querySelector('[data-store="home-slider"]') ||
               document.querySelector('.section-slideshow');
    if (!hero) return; // solo en el home

    var track = el('div', 'pf-floating__track');
    PRODUCT_IDS.forEach(function (id) {
      var p = readFromPage(id) || FALLBACK[id];
      // Si escribiste una descripción corta en FALLBACK, se usa esa.
      if (p && FALLBACK[id] && FALLBACK[id].desc) p.desc = FALLBACK[id].desc;
      if (p) track.appendChild(buildCard(p));
    });
    if (!track.children.length) return;

    var wrap = el('section', 'pf-floating');
    wrap.setAttribute('aria-label', TITLE);
    var head = el('div', 'pf-floating__head');
    var cloud = el('div', 'pf-cloud');
    cloud.appendChild(el('h2', 'pf-cloud__text', TITLE));
    head.appendChild(cloud);
    wrap.appendChild(head);
    wrap.appendChild(track);
    function place() {
      if (hero.nextElementSibling !== wrap) hero.parentNode.insertBefore(wrap, hero.nextSibling);
    }
    place();
    document.body.classList.add('pf-on');

    // Algunas apps (p. ej. reseñas) se insertan después y empujarían las
    // tarjetas hacia abajo: durante unos segundos las devolvemos a su lugar.
    if (window.MutationObserver) {
      var moves = 0;
      var obs = new MutationObserver(function () {
        if (hero.nextElementSibling !== wrap && moves++ < 20) place();
      });
      obs.observe(hero.parentNode, { childList: true });
      setTimeout(function () { obs.disconnect(); }, 15000);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
