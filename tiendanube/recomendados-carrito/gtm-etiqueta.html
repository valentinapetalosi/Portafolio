<!-- Petalosi · "Súmale un detallito": productos de menos de $36.000 dentro del carrito.
     Google Tag Manager: etiqueta NUEVA de "HTML personalizado", activador "All Pages".
     - Los productos salen en vivo de la tienda (lista ordenada por precio), así que precio,
       foto y stock siempre están al día. No hay que actualizar nada a mano.
     - Solo productos con stock, que no estén ya en el carrito, y fuera de la lista EXCLUIR.
     - Se agregan al carrito sin salir de él, con la misma función que usa la tienda.
       Si el producto tiene varios diseños, se elige en un desplegable. -->
<script>
(function (run) {
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', run) : run();
})(function () {
  if (window.__petalosiRecomendados) return;
  window.__petalosiRecomendados = true;
  if (/checkout/i.test(location.hostname + location.pathname)) return;

  var PRECIO_MAX = 36000;          // solo productos por debajo de este precio
  var MAXIMO = 8;                  // cuántas tarjetas como máximo
  var EXCLUIR = [370492898];       // Pack x 5 Postales (es el regalo por compras grandes)
  var TITULO = 'Súmale un detallito';

  // ---------- 1. Leer los productos baratos de la tienda ----------
  var productos = null;
  function leerPagina(n) {
    return fetch('/productos/?sort_by=price-ascending&page=' + n, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (txt) {
        var doc = new DOMParser().parseFromString(txt, 'text/html');
        var lista = [];
        doc.querySelectorAll('.js-item-product[data-product-id]').forEach(function (el) {
          try {
            var info = JSON.parse(el.querySelector('script[type="application/ld+json"]').textContent);
            var variantes = JSON.parse(el.getAttribute('data-variants') || '[]');
            lista.push({
              id: Number(el.getAttribute('data-product-id')),
              nombre: info.name,
              url: (info.offers && info.offers.url) || '',
              img: info.image,
              variantes: variantes
            });
          } catch (e) {}
        });
        return lista;
      });
  }
  function cargar() {
    return leerPagina(1).then(function (p1) {
      var ultimo = p1[p1.length - 1];
      var sigue = ultimo && ultimo.variantes.some(function (v) { return v.price_number < PRECIO_MAX; });
      return sigue ? leerPagina(2).then(function (p2) { return p1.concat(p2); }) : p1;
    }).then(function (todos) {
      var vistos = {};
      productos = todos.filter(function (p) {
        if (vistos[p.id] || EXCLUIR.indexOf(p.id) > -1) return false;
        vistos[p.id] = true;
        p.disponibles = p.variantes.filter(function (v) { return v.available && v.price_number < PRECIO_MAX; });
        return p.disponibles.length > 0;
      });
      // Orden al azar para que no salgan siempre los mismos.
      for (var i = productos.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1)), t = productos[i]; productos[i] = productos[j]; productos[j] = t;
      }
      pintar();
    }).catch(function () {});
  }

  // ---------- 2. Dibujar las tarjetas ----------
  var css = document.createElement('style');
  css.textContent =
    // --pr-w = ancho de la foto de los productos del carrito (se mide en vivo; 78px en celular).
    '#petalosi-reco{--pr-w:78px;margin:4px 0 16px;}' +
    '#petalosi-reco h4{margin:0 0 8px;font-size:14px;font-weight:600;}' +
    '#petalosi-reco .pr-fila{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}' +
    '#petalosi-reco .pr-card{flex:0 0 var(--pr-w);width:var(--pr-w);scroll-snap-align:start;display:flex;flex-direction:column;gap:3px;}' +
    '#petalosi-reco .pr-img{display:block;width:var(--pr-w);height:var(--pr-w);object-fit:cover;border-radius:4px;background:#f3eee6;}' +
    '#petalosi-reco .pr-nombre{font-size:11px;line-height:1.25;color:inherit;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:27px;}' +
    '#petalosi-reco .pr-precio{font-size:11.5px;font-weight:700;}' +
    '#petalosi-reco select{width:100%;font-family:inherit;font-size:10.5px;padding:2px;border:1px solid rgba(0,0,0,.2);border-radius:4px;background:transparent;color:inherit;}' +
    '#petalosi-reco button{margin-top:auto;width:100%;padding:5px 2px;font-family:inherit;font-size:11.5px;font-weight:600;border:0;border-radius:4px;background:#007E33;color:#FFFAF0;cursor:pointer;}' +
    '#petalosi-reco button[disabled]{opacity:.6;cursor:default;}';
  document.head.appendChild(css);

  var caja = document.createElement('div');
  caja.id = 'petalosi-reco';

  function enCarrito() {
    var ids = {};
    ((window.LS && LS.cart && LS.cart.items) || []).forEach(function (it) {
      var p = it.product;
      ids[(p && typeof p === 'object') ? p.id : p] = true;
    });
    return ids;
  }

  var firmaActual = '';
  function pintar() {
    if (!productos) return;
    var ya = enCarrito();
    var lista = productos.filter(function (p) { return !ya[p.id]; }).slice(0, MAXIMO);
    var vacio = !((window.LS && LS.cart && LS.cart.items) || []).length;
    if (vacio) lista = [];   // con el carrito vacío no se recomienda nada
    var firma = lista.map(function (p) { return p.id; }).join(',');
    if (firma === firmaActual) return;
    firmaActual = firma;
    caja.innerHTML = '';
    if (!lista.length) { caja.style.display = 'none'; return; }
    caja.style.display = '';
    var h = document.createElement('h4'); h.textContent = TITULO; caja.appendChild(h);
    var fila = document.createElement('div'); fila.className = 'pr-fila'; caja.appendChild(fila);
    lista.forEach(function (p) { fila.appendChild(tarjeta(p)); });
  }

  function tarjeta(p) {
    var c = document.createElement('div'); c.className = 'pr-card';
    var v0 = p.disponibles[0];
    var a = document.createElement('a'); a.href = p.url;
    var img = document.createElement('img'); img.className = 'pr-img'; img.alt = p.nombre;
    img.src = (v0.image_url ? 'https:' + v0.image_url.replace(/^https?:/, '') : p.img);
    a.appendChild(img); c.appendChild(a);
    var n = document.createElement('a'); n.className = 'pr-nombre'; n.href = p.url; n.textContent = p.nombre; c.appendChild(n);
    var precio = document.createElement('div'); precio.className = 'pr-precio'; precio.textContent = v0.price_short; c.appendChild(precio);

    var sel = null;
    if (p.variantes.length > 1) {
      sel = document.createElement('select');
      sel.setAttribute('aria-label', 'Elige el diseño de ' + p.nombre);
      p.disponibles.forEach(function (v, i) {
        var o = document.createElement('option'); o.value = i;
        o.textContent = [v.option0, v.option1, v.option2].filter(Boolean).join(' / ');
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () {
        var v = p.disponibles[sel.value];
        if (v.image_url) img.src = 'https:' + v.image_url.replace(/^https?:/, '');
        precio.textContent = v.price_short;
      });
      c.appendChild(sel);
    }

    var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Agregar';
    b.addEventListener('click', function () {
      var v = p.disponibles[sel ? sel.value : 0];
      agregar(p, v, b);
    });
    c.appendChild(b);
    return c;
  }

  // ---------- 3. Agregar al carrito ----------
  function agregar(p, v, boton) {
    boton.disabled = true; boton.textContent = 'Agregando…';
    // Formulario igual al de la tienda. No se mete en la página: si estuviera dentro del
    // carrito, la tienda lo cerraría después de agregar.
    var f = document.createElement('form');
    f.action = '/comprar/'; f.method = 'post';
    var campos = { add_to_cart: p.id, quantity: 1 };
    if (p.variantes.length > 1) {
      ['option0', 'option1', 'option2'].forEach(function (k, i) { if (v[k]) campos['variation[' + i + ']'] = v[k]; });
    }
    Object.keys(campos).forEach(function (k) {
      var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = campos[k]; f.appendChild(i);
    });
    var listo = function () { boton.textContent = '¡Listo!'; setTimeout(pintar, 800); };
    if (window.LS && typeof LS.addToCartEnhanced === 'function') {
      Promise.resolve(LS.addToCartEnhanced(f, '', '', '', true, function () {
        boton.disabled = false; boton.textContent = 'Agregar';
      })).then(listo, function () { boton.disabled = false; boton.textContent = 'Agregar'; });
    } else {
      document.body.appendChild(f); f.submit();   // plan B: envío normal
    }
  }

  // ---------- 4. Colocar dentro del carrito, debajo de los productos ----------
  function colocar() {
    var lista = document.querySelector('#modal-cart .js-ajax-cart-list');
    if (!lista || !lista.parentNode) return;
    if (lista.nextSibling !== caja) lista.parentNode.insertBefore(caja, lista.nextSibling);
    var foto = lista.querySelector('.cart-item-image, img');
    var w = foto ? Math.round(foto.getBoundingClientRect().width) : 0;
    if (w >= 50 && w <= 160) caja.style.setProperty('--pr-w', w + 'px');
    pintar();
  }
  var cargado = false;
  function revisar() {
    var m = document.getElementById('modal-cart');
    if (!cargado && m && m.classList.contains('modal-show')) { cargado = true; cargar(); }
    colocar();
  }
  revisar();
  new MutationObserver(function () { clearTimeout(revisar._t); revisar._t = setTimeout(revisar, 80); })
    .observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
});
</script>
